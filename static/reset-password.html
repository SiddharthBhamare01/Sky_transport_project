<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set a new password — Shipment Document Data Extractor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="auth-body">
  <div class="auth-card panel">
    <div class="brand auth-brand">
      <span class="brand-mark">✈</span>
      <h1>Set a new password</h1>
    </div>

    <div id="errorBox" class="error-box hidden"></div>
    <div id="statusBox" class="status-box hidden"></div>

    <form id="resetForm">
      <div class="field-row auth-field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required autocomplete="new-password" minlength="6" />
      </div>
      <button class="primary auth-submit" id="submitBtn" type="submit">Update password</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function showError(msg) {
      $("statusBox").classList.add("hidden");
      if (!msg) { $("errorBox").classList.add("hidden"); return; }
      $("errorBox").textContent = msg;
      $("errorBox").classList.remove("hidden");
    }
    function showStatus(msg) {
      $("errorBox").classList.add("hidden");
      $("statusBox").textContent = msg;
      $("statusBox").classList.remove("hidden");
    }

    $("resetForm").onsubmit = async (e) => {
      e.preventDefault();
      showError(null);
      $("submitBtn").disabled = true;
      try {
        const { data } = await db.auth.getSession();
        if (!data.session) {
          showError("This reset link has expired or already been used. Request a new one from the sign-in page.");
          return;
        }
        const { error } = await updatePassword($("newPassword").value);
        if (error) return showError(error.message);
        showStatus("Password updated. Redirecting to sign in…");
        await signOut();
        setTimeout(() => (location.href = "./login.html"), 1500);
      } finally {
        $("submitBtn").disabled = false;
      }
    };
  </script>
</body>
</html>
