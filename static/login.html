<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Shipment Document Data Extractor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="auth-body">
  <div class="auth-card panel">
    <div class="brand auth-brand">
      <span class="brand-mark">✈</span>
      <h1>Sky Transport</h1>
    </div>

    <div id="errorBox" class="error-box hidden"></div>
    <div id="statusBox" class="status-box hidden"></div>

    <form id="authForm">
      <div class="field-row auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field-row auth-field" id="passwordRow">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" />
      </div>
      <button class="primary auth-submit" id="submitBtn" type="submit">Sign in</button>
    </form>

    <button class="google-btn" id="googleBtn" type="button">Continue with Google</button>

    <div class="auth-links">
      <a href="#" id="toggleModeLink">Need an account? Sign up</a>
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let mode = "signin"; // signin | signup | forgot

    function showError(msg) {
      $("statusBox").classList.add("hidden");
      if (!msg) { $("errorBox").classList.add("hidden"); return; }
      $("errorBox").textContent = msg;
      $("errorBox").classList.remove("hidden");
    }
    function showStatus(msg) {
      $("errorBox").classList.add("hidden");
      $("statusBox").textContent = msg;
      $("statusBox").classList.remove("hidden");
    }

    function applyMode() {
      showError(null);
      $("passwordRow").style.display = mode === "forgot" ? "none" : "grid";
      $("googleBtn").style.display = mode === "forgot" ? "none" : "block";
      $("password").required = mode !== "forgot";
      if (mode === "signin") {
        $("submitBtn").textContent = "Sign in";
        $("toggleModeLink").textContent = "Need an account? Sign up";
        $("forgotLink").style.display = "inline";
      } else if (mode === "signup") {
        $("submitBtn").textContent = "Create account";
        $("toggleModeLink").textContent = "Already have an account? Sign in";
        $("forgotLink").style.display = "inline";
      } else {
        $("submitBtn").textContent = "Send reset link";
        $("toggleModeLink").textContent = "Back to sign in";
        $("forgotLink").style.display = "none";
      }
    }

    $("toggleModeLink").onclick = (e) => {
      e.preventDefault();
      mode = mode === "signin" ? "signup" : "signin";
      applyMode();
    };
    $("forgotLink").onclick = (e) => {
      e.preventDefault();
      mode = "forgot";
      applyMode();
    };

    $("authForm").onsubmit = async (e) => {
      e.preventDefault();
      showError(null);
      const email = $("email").value.trim();
      const password = $("password").value;
      $("submitBtn").disabled = true;
      try {
        if (mode === "signin") {
          const { error } = await signInWithPassword(email, password);
          if (error) return showError(error.message);
          location.href = "./index.html";
        } else if (mode === "signup") {
          const { error } = await signUp(email, password);
          if (error) return showError(error.message);
          showStatus("Account created. Check your email to confirm, then sign in.");
          mode = "signin";
          applyMode();
        } else {
          const { error } = await requestPasswordReset(email);
          if (error) return showError(error.message);
          showStatus("Password reset link sent — check your email.");
          mode = "signin";
          applyMode();
        }
      } finally {
        $("submitBtn").disabled = false;
      }
    };

    $("googleBtn").onclick = async () => {
      const { error } = await signInWithGoogle();
      if (error) showError(error.message);
    };

    (async () => {
      const { data } = await db.auth.getSession();
      if (data.session) location.href = "./index.html";
    })();

    applyMode();
  </script>
</body>
</html>
